<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenCode 线路池</title>
<style>body{font:16px system-ui;color:#253245;background:#f3f6fa;max-width:900px;margin:40px auto;padding:0 20px}h1{font-size:28px}section{background:white;border:1px solid #dce3ec;border-radius:14px;padding:24px;margin:18px 0}label{display:block;margin:15px 0 6px}select{width:100%;padding:12px;border:1px solid #bcc9d9;border-radius:8px;background:white;font-size:15px}button{padding:12px 18px;margin:14px 8px 0 0;border:0;border-radius:8px;background:#1b65dc;color:white;font-size:15px;cursor:pointer}button:disabled{opacity:.45;cursor:wait}.muted{color:#64748b;font-size:14px}.warn{background:#fff7e3;padding:12px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px system-ui}article{border-top:1px solid #e2e8f0;padding:12px 0}.ok{color:#147545}.bad{color:#ab3825}input{margin-right:8px}</style>
<h1>OpenCode 线路池</h1><p class="muted">选择线路 → 查看出口 → 按需验证模型。Codex 接口固定为 127.0.0.1:8789/v1。</p>
<section><div id="status">读取中…</div><label>代理组</label><select id="group"></select><label>线路</label><select id="node"></select><p id="current" class="muted"></p><p id="tunnels" class="muted"></p><p class="warn">切换会影响使用同一 Clash 代理组的其他应用，并关闭 OpenCode 桌面、CLI 和反代已有的 opencode.ai 连接；正在生成的请求会中断。旧连接清理目前按进程名识别；如果切换后桌面仍走旧线路，请重启 OpenCode 桌面。线路名称不保证对应独立 IP；出口检测与模型请求的实际路由也可能不同。</p><label>检测模型</label><select id="model"></select><label><input id="generate" type="checkbox">发送真实请求验收（会使用上游额度）</label><label>验收范围</label><select id="validation"><option value="full">完整：生成、流式、工具调用与结果回传（最多 4 次请求）</option><option value="text">快速：只回复 OK（1 次请求）</option></select><button id="check">检测当前线路</button><button id="switch">切换并检测</button><button id="refresh">刷新</button><button id="reset">清理旧线路状态</button><pre id="result" aria-live="polite"></pre></section>
<section><h2>最近检测</h2><p class="muted">429 表示该次请求额度受限；成功不代表剩余额度充足。这里不是自动轮换器。</p><div id="history"></div></section>
<script nonce="__TOKEN__">
const $=id=>document.getElementById(id);let state;
const labels={available:'本次验收通过',limited:'额度受限',rejected:'请求被拒绝',failed:'生成未通过',network_error:'网络错误'};
function options(el,items,value){el.replaceChildren(...items.map(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;return o}));if(items.includes(value))el.value=value;}
function group(){const g=state.groups.find(x=>x.name===$('group').value);options($('node'),g?.nodes||[],g?.now);$('current').textContent='当前选中：'+(g?.now||'未知');}
function describe(r){return [new Date(r.time).toLocaleString(),r.group+' / '+r.node+(r.model?' / '+r.model:''),r.exit?'出口 '+r.exit.ip+' · '+r.exit.location+' · '+r.exit.edge:'出口检测失败：'+r.networkError,r.result?(labels[r.result.status]||r.result.status)+' · '+r.result.message+' · '+r.result.ms+' ms':'未发送模型请求',r.result?.routes?.length?'推理连接线路：'+[...new Set(r.result.routes.map(x=>x.chains.join(' → ')))].join('；'):'推理线路未捕获',r.verification==='full'?'完整验收：'+(r.result?.stages||[]).map(x=>({text:'普通生成',stream:'流式响应',tool_call:'工具调用',tool_result:'结果回传'}[x.stage]||x.stage)+' '+(x.ok?'通过':'失败：'+x.message)).join('；'):r.result?'仅快速生成验收，未验证工具调用':'未验收生成或工具调用'].join('\n');}
async function refresh(){try{const r=await fetch('/api/state');state=await r.json();if(!r.ok)throw Error(state.error);const old=$('group').value;options($('group'),state.groups.map(x=>x.name),old||'节点选择');group();options($('model'),state.models,$('model').value||'deepseek-v4.1-flash-free');$('status').textContent=state.proxyError?'Clash 已连接；反代异常：'+state.proxyError:'服务在线 · 模型目录正常（不代表模型已通过验收）';$('tunnels').textContent=state.tunnelError?'旧连接读取失败：'+state.tunnelError:(state.tunnels?.length?'当前 OpenCode 连接：'+state.tunnels.map(x=>x.process+' → '+(x.chains[0]||'未知')).join('；'):'当前没有 OpenCode 旧连接');$('history').replaceChildren(...state.history.map(r=>{let a=document.createElement('article');let p=document.createElement('pre');p.textContent=describe(r);if(r.result)p.className=r.result.status==='available'?'ok':'bad';a.append(p);return a}));}catch(e){$('status').textContent='连接失败：'+e.message;}}
async function act(path){document.querySelectorAll('button,select,input').forEach(x=>x.disabled=true);$('result').textContent='检测中，请等待…';try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Pool-Token':'__TOKEN__'},body:JSON.stringify({group:$('group').value,node:$('node').value,model:$('model').value,generate:$('generate').checked,full:$('validation').value==='full'})});const d=await r.json();if(!r.ok)throw Error(d.error);$('result').textContent=d.message||describe(d);}catch(e){$('result').textContent=e.message;}finally{document.querySelectorAll('button,select,input').forEach(x=>x.disabled=false);await refresh();}}
$('group').onchange=group;$('check').onclick=()=>act('/api/check');$('switch').onclick=()=>act('/api/switch');$('refresh').onclick=refresh;$('reset').onclick=()=>act('/api/reset');refresh();
</script></html>
